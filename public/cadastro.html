<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Membro - Jardim de Oração</title>
    <link rel="stylesheet" href="estilo-cadastro.css">
</head>

<body class="estilo-cadastro">
    <div class="container-login-cadastro">
        <div class="form-wrapper">
            <div class="form-header">
                <img src="assets/Logo_site_igreja.png" alt="Logo Igreja" class="logo-cadastro">
                <h1>Cadastro</h1>
                <p>Membro da Comunidade</p>
            </div>

            <!-- multipart/form-data é necessário para envio de arquivos (Foto) -->
            <form id="formCadastroMembro" enctype="multipart/form-data" class="form-cadastro">
                <div class="form-group">
                    <label for="txtnome">Nome Completo</label>
                    <input type="text" id="txtnome" name="nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="form-group">
                    <label for="txtemail">E-mail</label>
                    <input type="email" id="txtemail" name="email" placeholder="seu.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="txttelefone">Telefone / WhatsApp</label>
                    <input type="tel" id="txttelefone" name="telefone" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="txtendereco">Endereço</label>
                    <input type="text" id="txtendereco" name="endereco" placeholder="Rua, número, bairro" required>
                </div>

                <div class="form-group">
                    <label for="txtcargo">Cargo na Igreja</label>
                    <select id="txtcargo" name="cargo" required>
                        <option value="">Selecione um cargo</option>
                        <option value="Membro">Membro</option>
                        <option value="Diácono / Diaconisa">Diácono / Diaconisa</option>
                        <option value="Presbítero">Presbítero</option>
                        <option value="Evangelista">Evangelista</option>
                        <option value="Pastor / Pastora">Pastor / Pastora</option>
                        <option value="Líder de Ministério">Líder de Ministério</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="foto">Foto do Membro</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>

                <button type="submit" class="btn-cadastro">Cadastrar Membro</button>
            </form>

            <div class="form-footer">
                <p>Já possui acesso?</p>
                <a href="login.html" class="btn-login">Acesse o Login aqui</a>
            </div>
        </div>

        <div class="form-decoracao">
            <h2>Bem-vindo</h2>
            <p>Faça parte da Igreja Jardim de Oração e encontre uma comunidade que te acolhe e cresce espiritualmente junto com você.</p>
            <div class="decoracao-elementos">
                <div class="elemento"></div>
                <div class="elemento"></div>
                <div class="elemento"></div>
            </div>
        </div>
    </div>

    <!-- Script de envio assíncrono para o Backend Node.js -->
    <script>
        document.getElementById('formCadastroMembro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/membros', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Membro cadastrado com sucesso!');
                    e.target.reset();
                } else {
                    alert('Erro ao cadastrar: ' + result.message);
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
